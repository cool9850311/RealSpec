# Three steps; a.feature and b.feature between them use two and c.feature the
# third. wrong.feature writes the third under a keyword it does not allow,
# which is not a use.

steps:

  - id: run_migration
    keywords: [Given]
    pattern: "^run migration$"
    docstring: ~
    description: Runs pending migrations.

  - id: response_status
    keywords: [Then, And]
    pattern: "^response status is ([1-5][0-9]{2})$"
    docstring: ~
    description: Asserts the status code.

  - id: reset_clock
    keywords: [Given]
    pattern: "^the clock is reset$"
    docstring: ~
    description: Used by no feature.
