# Minimal step registry for the CLI fixtures.
#
# Mirrors the shape of the original format.yml, trimmed to the
# handful of steps the tests need. `content_pattern` is present on purpose:
# the validator never enforces it, and that is intended.

# Data-driven docstring rules. Nothing about these lives in the validator.
substitutions:
  - in: json
    match: '"\{[a-z][a-zA-Z0-9]+\}"'
    with: '"__ctx__"'
  - in: json
    match: '"<non-null>"'
    with: '"__non_null__"'
  - in: json
    match: '"<[a-zA-Z][a-zA-Z0-9]*>"'
    with: '"__outline__"'
  - in: sql
    match: "'\\{[a-z][a-zA-Z0-9]+\\}'"
    with: "'__ctx__'"

steps:

  - id: run_migration
    keywords: [Given]
    pattern: "^run migration$"
    docstring: ~
    description: Runs pending migrations.

  - id: exec_postgresql
    keywords: [Given, And]
    pattern: "^in PostgreSQL:$"
    docstring:
      type: sql
      content_pattern: "^(?!\\s*$)[\\s\\S]+$"
    description: Executes raw SQL.

  - id: postgresql_query_returns
    keywords: [Then, And, Given]
    pattern: "^in PostgreSQL query returns ([0-9]+) rows?:$"
    docstring:
      type: sql
      content_pattern: "^(?!\\s*$)\\s*SELECT\\s[\\s\\S]+$"
      must_match: '^\s*[Ss][Ee][Ll][Ee][Cc][Tt]\b'
      must_match_message: SQL in a query-assertion step must begin with SELECT
    description: Asserts a SELECT row count.

  - id: http_request
    keywords: [When]
    pattern: "^(GET|POST|PUT|PATCH|DELETE) (/api/v1/[a-zA-Z0-9/{}:._?=&%-]+):$"
    docstring:
      type: json
      allowed_top_level_keys: [headers, body]
      schema:
        headers:
          required: false
        body:
          required: false
    description: Sends an HTTP request.

  - id: response_status
    keywords: [Then, And]
    pattern: "^response status is ([1-5][0-9]{2})$"
    docstring: ~
    description: Asserts the status code.

  - id: response_body_contains
    keywords: [Then, And]
    pattern: "^response body contains:$"
    docstring:
      type: json
      content_pattern: "^(?!\\s*$)[\\s\\S]+$"
      special_values:
        - token: "\"<non-null>\""
    description: Partial JSON match.
