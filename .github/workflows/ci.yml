# minimart — CI
#
# Every path here is relative to the repository root, so this file is the
# examples' pipeline rather than a template to copy: a new project writes its
# own paths. What travels is the shape, not the file — three stages, in this
# order, and a failure in an earlier one stops the later ones.
#
#   1. validate   the specification is well-formed before anything runs
#   2. api        scenarios whose When is an HTTP call
#                 (godog for go-nuxt, Cucumber-JVM for java-next)
#   3. e2e        scenarios whose When is a real browser action (playwright-bdd)
#
# Stage 1 is first because it is the only stage that costs nothing: a feature
# file naming a step that does not exist should never reach a container.
#
# Triggers. Pull requests only. A push to a branch that has a pull request open
# would run everything twice, and a push to main has already been through the
# pull request that produced it — the result of running it again there is a
# result nobody is waiting on.
#
# Path filters. The `changes` job decides which examples a pull request can
# have affected, and only those run:
#
#   shared     packages/**, package.json, package-lock.json, this file — the
#              validator, the one npm workspace every example installs
#              through, and the pipeline itself. A change here runs the
#              validator's own tests and every example's stage 1, which is
#              where the validator actually executes against each
#              specification. It does not run stages 2 and 3:
#              those rebuild an example's images and drive its containers, and
#              only a change inside that example's own directory earns that.
#   go_nuxt    examples/minimart-go-nuxt/**
#   java_next  examples/minimart-java-next/**
#
# Each example has its own three stages, and each stage needs the previous one.
# Stage 1 runs when the example's own directory or `shared` changed; stages 2
# and 3 run only when the example's own directory changed. A job whose condition is false is
# skipped, and so is every job that needs it — that is intended: an untouched
# example is not rebuilt. GitHub reports a skipped job as successful for branch
# protection, so required checks on these jobs do not block a pull request that
# never touched their example.
#
# Each job needs only the stage before it, never `changes` directly: stage 1
# passes its example's flag on as an output, stage 2 reads it from there, and
# stage 3 has no condition of its own — it runs exactly when stage 2 passed.
# Needing `changes` from every stage would behave the same, but GitHub's graph
# routes those column-skipping edges through the neighbouring example's jobs,
# which makes the two chains look connected when they are not.
#
# Stages 2 and 3 both start containers per scenario, so the runner needs a
# working Docker daemon — ubuntu-latest has one. They are separate, sequential
# jobs rather than parallel ones: both saturate the runner's CPU with container
# startups, and competing for it turns a timing-sensitive suite flaky. The two
# examples' chains run on separate runners, so they do not compete with each
# other.
#
# Every command below is the command that is run locally. There is no CI-only
# variant, no relaxed timeout and no retry: a suite that needs different
# settings to pass on a runner is not passing. Concurrency is not set here
# either: the runners halve the machine's CPU count themselves, which is the
# only number that is right on a 2-vCPU runner and on a developer's laptop
# both. GODOG_CONCURRENCY and E2E_WORKERS override, and deliberately are unset.
#
# Paths are written from the repository root because these examples live inside
# the RealSpec repository. A standalone project drops the `examples/…` prefix,
# the path filters and the per-example job prefixes.

name: ci

on:
  pull_request:

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      go_nuxt: ${{ steps.filter.outputs.go_nuxt }}
      java_next: ${{ steps.filter.outputs.java_next }}
      paygate: ${{ steps.filter.outputs.paygate }}
    steps:
      - uses: actions/checkout@v4

      # On pull_request the changed files come from the GitHub API, hence
      # pull-requests: read. The checkout is not needed for that; it is there
      # so the same step keeps working, by comparing git history instead, if
      # another trigger is ever added.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            go_nuxt:
              - 'examples/minimart-go-nuxt/**'
            java_next:
              - 'examples/minimart-java-next/**'
            paygate:
              - 'examples/paygate-rust-nuxt/**'

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every example is a whole working system, so each one carries values
      # that are SHAPED like credentials — the pair a scenario signs with, the
      # key a fixture seeds, the password a login test types. `.gitleaks.toml`
      # forgives those by VALUE, one at a time, never by file: a path-based
      # allowlist would stop looking at exactly the files most likely to grow a
      # real secret later. Adding a fixture credential therefore means adding it
      # to that config, in a diff somebody reviews.
      #
      # This runs on every pull request, not behind the `changes` filter: a
      # secret can arrive in any file, including the ones no example owns.
      - name: Scan the working tree for secrets
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            dir . --config .gitleaks.toml --redact --no-banner

  validator-tests:
    name: validator tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build -w @realspec/cli

      # The validator's own tests. One of them — the parity case — compares
      # this validator byte for byte with the Python one it was ported from,
      # over that project's corpus. The corpus is not in this repository, so
      # the case skips here unless REALSPEC_PARITY_CORPUS names a checkout of
      # it. This step passing is not a parity result.
      - name: Validator tests (parity case skips, its corpus is not in this repository)
        run: npm test

  # ─── minimart-go-nuxt ──────────────────────────────────────────────────────

  go-nuxt-validate:
    name: go-nuxt · 1 validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go_nuxt == 'true' || needs.changes.outputs.shared == 'true'
    # Stage 2 reads this instead of needing `changes` itself (see the header).
    outputs:
      example_changed: ${{ needs.changes.outputs.go_nuxt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The validator is this repository's own package. A standalone project
      # installs it instead and calls `npx realspec validate …`.
      - run: npm ci
      - run: npm run build -w @realspec/cli

      # format.yml is found by walking up from each feature file, so features
      # that live inside spec/ need no path configuration.
      - name: Validate spec features
        run: >
          node packages/cli/dist/cli.js validate
          examples/minimart-go-nuxt/spec/bdd/api/*.feature
          examples/minimart-go-nuxt/spec/bdd/e2e/*.feature

      # The harness fixtures deliberately live outside spec/ — they test the
      # harness and are not part of minimart's specification — so they need the
      # registry pointed at explicitly.
      - name: Validate harness fixtures
        run: >
          node packages/cli/dist/cli.js validate
          --format examples/minimart-go-nuxt/spec/bdd/format.yml
          examples/minimart-go-nuxt/frontend/tests/e2e/harness/features/*/*.feature

  go-nuxt-api:
    name: go-nuxt · 2 API scenarios
    runs-on: ubuntu-latest
    needs: go-nuxt-validate
    if: needs.go-nuxt-validate.outputs.example_changed == 'true'
    defaults:
      run:
        working-directory: examples/minimart-go-nuxt/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: examples/minimart-go-nuxt/backend/go.sum

      - run: go vet ./...

      # Formatting is a build failure, not a review comment.
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # Builds the service image once, then one network + PostgreSQL + service
      # container per scenario. -count=1 defeats Go's test cache: a green run
      # must mean the scenarios actually ran.
      - name: Unit tests and API scenarios
        run: go test -count=1 ./...

  go-nuxt-e2e:
    name: go-nuxt · 3 e2e scenarios
    runs-on: ubuntu-latest
    needs: go-nuxt-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # In order: the two @intlify ESLint rules over the i18n catalogue, types
      # for the app and for the harness, then the two checks whose inputs are
      # not JavaScript — the keys and test IDs the feature files name must exist
      # in the app. A missing element is a build failure here rather than a
      # silently passing test later.
      #
      # check:bundle is not in this list: it asserts a property of the build
      # output, so it runs as the second half of `nuxt generate`, inside the
      # image build that the next step triggers.
      - run: npm run check -w @minimart/frontend

      # Chromium watches the kernel's netlink socket for address changes and
      # closes every in-flight HTTP/2 session the moment one arrives (see
      # net/spdy/spdy_session_pool.cc, OnIPAddressChanged). Starting a
      # container from here on creates a veth, and the kernel hands it an
      # IPv6 link-local address — that is such a change. `default`, not
      # `all`: this only sets the template for interfaces created from this
      # point on, so the runner's own interfaces are untouched.
      - name: Disable IPv6 on interfaces Docker is about to create
        # Read back rather than trust the exit code: `sysctl -w` prints
        # "ignoring: Read-only file system" and still exits 0 where /proc/sys is
        # not writable, which is a green step that did nothing.
        run: |
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          test "$(cat /proc/sys/net/ipv6/conf/default/disable_ipv6)" = 1

      # The certificate each scenario's proxy serves is generated, never
      # committed. The next step's global setup runs this script too, and it is
      # idempotent — running it here makes a missing openssl a named failure
      # instead of one surfacing from inside the suite, and proves the file is
      # there before anything depends on it.
      - name: Generate the TLS certificate
        run: |
          examples/minimart-go-nuxt/local/certs/generate.sh
          test -s examples/minimart-go-nuxt/local/certs/cert.pem

      # Builds both images, creates the run's one network, starts the shared
      # frontend container on it, then a PostgreSQL + backend + Caddy per
      # scenario joining that same network — one bridge for the whole run,
      # because creating one while a browser is running aborts its requests
      # (see spec.md, "Isolation"). The Caddy config is local/Caddyfile — the
      # same file local development uses.
      - run: npm run test:e2e -w @minimart/frontend

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artefacts
          path: reports/e2e/
          retention-days: 7

  # ─── minimart-java-next ────────────────────────────────────────────────────

  java-next-validate:
    name: java-next · 1 validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.java_next == 'true' || needs.changes.outputs.shared == 'true'
    # Stage 2 reads this instead of needing `changes` itself (see the header).
    outputs:
      example_changed: ${{ needs.changes.outputs.java_next }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The same validator, the same command: the spec does not know which
      # language will run it.
      - run: npm ci
      - run: npm run build -w @realspec/cli

      # format.yml is found by walking up from each feature file, so features
      # that live inside spec/ need no path configuration.
      - name: Validate spec features
        run: >
          node packages/cli/dist/cli.js validate
          examples/minimart-java-next/spec/bdd/api/*.feature
          examples/minimart-java-next/spec/bdd/e2e/*.feature

      # The harness fixtures deliberately live outside spec/ — they test the
      # harness and are not part of minimart's specification — so they need the
      # registry pointed at explicitly.
      - name: Validate harness fixtures
        run: >
          node packages/cli/dist/cli.js validate
          --format examples/minimart-java-next/spec/bdd/format.yml
          examples/minimart-java-next/frontend/tests/e2e/harness/features/*/*.feature

  java-next-api:
    name: java-next · 2 API scenarios
    runs-on: ubuntu-latest
    needs: java-next-validate
    if: needs.java-next-validate.outputs.example_changed == 'true'
    defaults:
      run:
        working-directory: examples/minimart-java-next/backend
    steps:
      - uses: actions/checkout@v4

      # The Maven wrapper pins Maven itself; this pins the JDK. The cache is
      # keyed on pom.xml, so a dependency change is a cache miss, not a stale
      # artefact.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: examples/minimart-java-next/backend/pom.xml

      # One command, the lifecycle in order: Spotless (formatting is a build
      # failure, not a review comment), compile with -Werror, unit tests under
      # Surefire, then — under Failsafe — the service image built once and one
      # network + PostgreSQL + service container per Cucumber scenario. Maven
      # has no test cache to defeat: every verify runs every scenario.
      - name: Format, compile, unit tests and API scenarios
        run: ./mvnw -B verify

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-next-api-artefacts
          path: |
            examples/minimart-java-next/backend/target/cucumber-reports/
            examples/minimart-java-next/backend/target/surefire-reports/
            examples/minimart-java-next/backend/target/failsafe-reports/
          retention-days: 7

  java-next-e2e:
    name: java-next · 3 e2e scenarios
    runs-on: ubuntu-latest
    needs: java-next-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # In order: types for the app and for the harness, the i18n catalogue,
      # then the two checks whose inputs are not JavaScript — the keys and test
      # IDs the feature files name must exist in the app. A missing element is
      # a build failure here rather than a silently passing test later.
      #
      # check:bundle is not in this list: it asserts a property of the build
      # output, so it runs as the second half of `next build`, inside the
      # image build that the next step triggers.
      - run: npm run check -w @minimart-java-next/frontend

      # Chromium watches the kernel's netlink socket for address changes and
      # closes every in-flight HTTP/2 session the moment one arrives (see
      # net/spdy/spdy_session_pool.cc, OnIPAddressChanged). Starting a
      # container from here on creates a veth, and the kernel hands it an
      # IPv6 link-local address — that is such a change. `default`, not
      # `all`: this only sets the template for interfaces created from this
      # point on, so the runner's own interfaces are untouched.
      - name: Disable IPv6 on interfaces Docker is about to create
        # Read back rather than trust the exit code: `sysctl -w` prints
        # "ignoring: Read-only file system" and still exits 0 where /proc/sys is
        # not writable, which is a green step that did nothing.
        run: |
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          test "$(cat /proc/sys/net/ipv6/conf/default/disable_ipv6)" = 1

      # The certificate each scenario's proxy serves is generated, never
      # committed. The next step's global setup runs this script too, and it is
      # idempotent — running it here makes a missing openssl a named failure
      # instead of one surfacing from inside the suite, and proves the file is
      # there before anything depends on it.
      - name: Generate the TLS certificate
        run: |
          examples/minimart-java-next/local/certs/generate.sh
          test -s examples/minimart-java-next/local/certs/cert.pem

      # Builds both images, creates the run's one network, starts the shared
      # frontend container on it, then a PostgreSQL + backend + Caddy per
      # scenario joining that same network — one bridge for the whole run,
      # because creating one while a browser is running aborts its requests
      # (see spec.md, "Isolation"). The Caddy config is local/Caddyfile — the
      # same file local development uses.
      - run: npm run test:e2e -w @minimart-java-next/frontend

      # Its own report directory, so a run of the other example on the same
      # machine never overwrites this one's artefacts.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-java-next-artefacts
          path: reports/e2e-java-next/
          retention-days: 7

  # ─── paygate-rust-nuxt ─────────────────────────────────────────────────────

  paygate-validate:
    name: paygate · 1 validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.paygate == 'true' || needs.changes.outputs.shared == 'true'
    # Stage 2 reads this instead of needing `changes` itself (see the header).
    outputs:
      example_changed: ${{ needs.changes.outputs.paygate }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build -w @realspec/cli

      # This example's registry lives beside its features, so it is found by
      # walking up — but spec.md and the three OpenAPI documents are validated
      # explicitly, because a payment service's contract is most of its spec and
      # a drifting schema is the failure this stage exists to catch early.
      - name: Validate spec
        run: >
          node packages/cli/dist/cli.js validate
          --format examples/paygate-rust-nuxt/spec/bdd/format.yml
          examples/paygate-rust-nuxt/spec/spec.md
          examples/paygate-rust-nuxt/spec/openapi/*.yaml
          examples/paygate-rust-nuxt/spec/bdd/api/*.feature
          examples/paygate-rust-nuxt/spec/bdd/e2e/*.feature

      # The harness fixtures test the harness and are not part of paygate's
      # specification, so they live outside spec/ and need the registry named.
      - name: Validate harness fixtures
        run: >
          node packages/cli/dist/cli.js validate
          --format examples/paygate-rust-nuxt/spec/bdd/format.yml
          examples/paygate-rust-nuxt/frontend/tests/e2e/harness/features/*/*.feature

  paygate-api:
    name: paygate · 2 API scenarios
    runs-on: ubuntu-latest
    needs: paygate-validate
    if: needs.paygate-validate.outputs.example_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and brings rustfmt and clippy, so
      # this needs no version here: the file is the single place it is stated.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/paygate-rust-nuxt/backend/target
            examples/paygate-rust-nuxt/backend/apitest/target
          key: paygate-cargo-${{ hashFiles('examples/paygate-rust-nuxt/backend/**/Cargo.lock') }}
          restore-keys: paygate-cargo-

      # librdkafka is built from source by rdkafka's cmake-build feature.
      # ubuntu-latest already has cmake and a C++ toolchain; this asserts it
      # rather than discovering it halfway through a compile.
      - name: Check the build tools librdkafka needs
        run: cmake --version && c++ --version

      # Formatting and lints are build failures, not review comments.
      - name: Formatting and lints
        working-directory: examples/paygate-rust-nuxt/backend
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      # The unit tests of every crate, plus the integration tests that start
      # their own PostgreSQL, Redis and ClickHouse through Testcontainers.
      - name: Unit and integration tests
        working-directory: examples/paygate-rust-nuxt/backend
        run: cargo test --workspace

      # The harness is its own workspace, so it is formatted, linted and run on
      # its own. It builds the service image once, then starts one stack of
      # eleven containers per scenario — every one of them Testcontainers',
      # which is why there is no compose file anywhere in this job.
      - name: Formatting and lints, API harness
        working-directory: examples/paygate-rust-nuxt/backend/apitest
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings

      - name: API scenarios
        working-directory: examples/paygate-rust-nuxt/backend/apitest
        run: cargo test --test api

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paygate-api-artefacts
          path: reports/
          retention-days: 7

  paygate-e2e:
    name: paygate · 3 e2e scenarios
    runs-on: ubuntu-latest
    needs: paygate-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The i18n rules, types for the app and for the harness, and the two
      # checks whose inputs are not JavaScript — every @key and every testid the
      # feature files name must exist in the app. A missing element is a build
      # failure here rather than a silently passing test later.
      - run: npm run check -w @paygate/frontend

      # Chromium watches the kernel's netlink socket for address changes and
      # closes every in-flight HTTP/2 session the moment one arrives. Starting a
      # container creates a veth, and the kernel hands it an IPv6 link-local
      # address — that is such a change. `default`, not `all`: this sets the
      # template for interfaces created from here on, leaving the runner's own
      # untouched.
      - name: Disable IPv6 on interfaces Docker is about to create
        # Read back rather than trust the exit code: `sysctl -w` prints
        # "ignoring: Read-only file system" and still exits 0 where /proc/sys is
        # not writable, which is a green step that did nothing.
        run: |
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          test "$(cat /proc/sys/net/ipv6/conf/default/disable_ipv6)" = 1

      # The certificate each scenario's Caddy serves. Generated, never
      # committed — the script is idempotent and the suite's own global setup
      # runs it too, so this step exists to turn a missing openssl/mkcert into a
      # named failure here instead of one surfacing from inside the suite.
      - name: Generate the TLS certificate
        run: |
          examples/paygate-rust-nuxt/local/certs/generate.sh
          test -s examples/paygate-rust-nuxt/local/certs/cert.pem

      # Builds the service image once, generates the static front end once, then
      # starts a stack per scenario — twelve containers, its own network, and
      # the front end copied into its own Caddy, so no scenario shares anything
      # with another (see spec.md, "Isolation").
      - run: npm run test:e2e -w @paygate/frontend

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paygate-e2e-artefacts
          path: reports/
          retention-days: 7
