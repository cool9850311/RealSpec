[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/provider",
    "crates/infra",
    "crates/kafkabus",
    "crates/api",
    "crates/worker",
    "crates/provider-mock",
    "crates/demo-merchant",
]
# apitest is its own workspace: `cargo test --workspace` here builds the
# services, and the BDD suite is run on its own from backend/apitest. Keeping it
# out is also what keeps rdkafka — and therefore cmake — off the path of anyone
# who only wants to run the suite.
exclude = ["apitest"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
paygate-domain = { path = "crates/domain" }
paygate-provider = { path = "crates/provider" }
paygate-infra = { path = "crates/infra" }
paygate-kafkabus = { path = "crates/kafkabus" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "util"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
form_urlencoded = "1"

uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

sha2 = "0.10"
hex = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
subtle = "2"
bcrypt = "0.19"
rand = "0.8"
base64 = "0.22"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
num_cpus = "1"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = false
strip = true
