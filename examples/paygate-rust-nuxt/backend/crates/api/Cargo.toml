[package]
name = "paygate-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "paygate-api"
path = "src/main.rs"

[dependencies]
paygate-domain = { workspace = true }
paygate-provider = { workspace = true }
paygate-infra = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
bcrypt = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
form_urlencoded = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The crate's own integration tests start real PostgreSQL and Redis. Same rule as
# every other suite here: the library owns the container lifecycle and nothing
# hand-rolls one (spec.md, "Isolation").
testcontainers = { version = "0.25", features = ["http_wait"] }
testcontainers-modules = { version = "0.13", features = ["postgres", "redis"] }
