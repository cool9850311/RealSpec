# Global JUnit Platform configuration, read by EVERY launch in this module:
# surefire's unit tests (`mvnw test`) and failsafe's Cucumber suite
# (`mvnw verify`) alike.
#
# Only settings that are harmless to both belong here. Everything that selects
# or shapes the Cucumber run — the feature directory, glue, plugins, parallelism
# — is declared on minimart.bdd.RunApiFeaturesIT with @ConfigurationParameter.
# The Cucumber engine is on surefire's classpath too, so a global
# cucumber.features here would make the unit-test phase start the Docker suite.

# Do not print the "share your report on reports.cucumber.io" banner. Nothing is
# ever published: cucumber.publish.enabled is left at its default, false.
cucumber.publish.quiet=true
