# Static settings only. Nothing here reads the environment: the service's whole
# configuration surface is AppConfig (PORT, DB_DSN, JWT_SECRET,
# SCHEMA_AUTO_MIGRATE, FRONTEND_ORIGIN, COOKIE_SECURE), and MinimartApplication
# starts Spring without the OS environment as a property source at all.

spring.application.name=minimart
spring.main.banner-mode=off

# On SIGTERM, stop accepting connections and give in-flight requests 10 seconds
# to finish — the Go service's shutdownTimeout.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# A client gets 10 seconds to send its request line and headers — the Go
# service's ReadHeaderTimeout. A connection that sends nothing is not held open
# for Tomcat's default 20.
server.tomcat.connection-timeout=10s

# The service is reached through the reverse proxy; no client-supplied
# forwarding header is trusted to name the caller, the scheme or the host.
server.forward-headers-strategy=none

# Errors outside the contract (a path the API does not have) are answered by
# Spring's JSON error endpoint, never by an HTML page.
server.error.whitelabel.enabled=false

# This service serves an API and nothing else: no static resources are mapped,
# so a path the API does not have is a plain 404 from the dispatcher rather than
# a lookup on the classpath.
spring.web.resources.add-mappings=false

# No endpoint takes an upload, and a request body is read as the bytes sent
# whatever its Content-Type (see JsonBody), as the Go service reads it. With
# multipart resolution on, the dispatcher would parse any multipart/form-data
# request into parts before the controller runs, consuming the body a JSON
# endpoint was about to read.
spring.servlet.multipart.enabled=false
